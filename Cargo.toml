[package]
name = "qr-screenshot"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.36.2"
image = { version = "0.25", default-features = false }
rqrr = "0.11"
raw-window-handle = "0.6.2"
screenshots = "0.8.10"
windows = { version = "0.51.1", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# 这个工具对极限运行速度不敏感，优先减小发布包体积。
opt-level = "z"
lto = true
codegen-units = 1
strip = true
