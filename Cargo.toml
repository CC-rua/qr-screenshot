[package]
name = "qr-screenshot"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", features = ["glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
rqrr = "0.11"
raw-window-handle = "0.6.2"
screenshots = "0.8.10"
windows = { version = "0.51.1", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
resvg = { version = "0.45.1", default-features = false }

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17.2", default-features = false }
tray-icon = { version = "0.26.1", default-features = false }

[profile.release]
# 这个工具对极限运行速度不敏感，优先减小发布包体积。
opt-level = "z"
lto = true
codegen-units = 1
strip = true
